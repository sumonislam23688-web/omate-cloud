name: Deploy OMate Cloud to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omate-cloud-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::Missing SUPABASE_PROJECT_ID"; exit 1; }
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link to your Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Install database tables and vector search
        run: supabase db push --yes
      - name: Deploy memory API
        run: supabase functions deploy omate-memory-api --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy MCP API
        run: supabase functions deploy omate-memory-mcp --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy four resources API
        run: supabase functions deploy omate-resources-api --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Deploy context window API
        run: supabase functions deploy omate-context-window --project-ref "$SUPABASE_PROJECT_ID" --use-api --no-verify-jwt
      - name: Show deployment result
        run: echo "OMate cloud database and four functions deployed to project $SUPABASE_PROJECT_ID"
